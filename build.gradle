plugins {
    id 'io.kestra.gradle.repository-conventions' version '1.2.6'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'io.kestra.gradle.inject-bom-versions' version '1.2.6'
    id 'io.kestra.gradle.plugin-doc-lint' version '1.2.6'
    id 'java-library'
    id 'idea'
    id 'jacoco'
    id 'com.adarshr.test-logger' version '4.0.0'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'signing'
    id 'com.github.ben-manes.versions' version '0.54.0'
    id 'net.researchgate.release' version '3.1.0'
}

def isBuildSnapshot = version.toString().endsWith('-SNAPSHOT')
def isKestraSnapshot = kestraVersion.toString().endsWith('-SNAPSHOT')

repositories {
    mavenLocal()
    mavenCentral()
    if (isBuildSnapshot || isKestraSnapshot) {
        maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    }
}

// Kestra 2.0 builds on Java 25; its class files cannot be read by an older javac.
final targetJavaVersion = JavaVersion.VERSION_25

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion.majorVersion)
    }
}

group = 'io.kestra.plugin'
description = 'Embedded REST server realtime trigger for Kestra'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Kestra's annotation processor reads parameter names to build the plugin schema.
    options.compilerArgs.add('-parameters')
}

// Kestra's platform BOM pins Jetty with a `strictly` constraint, for the benefit of plugins that embed
// it. Kestra core itself has no Jetty dependency, while Javalin 7 is compiled against a newer Jetty, and
// mixing the two throws NoSuchMethodError inside Jetty's own modules. So Javalin's Jetty wins here.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group.startsWith('org.eclipse.jetty')) {
            details.useVersion jettyVersion
            details.because "aligned with Javalin $javalinVersion, overriding the Kestra platform BOM"
        }
    }
}

dependencies {
    // Platform
    annotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    implementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'

    // kestra — provided by the runtime, must not be bundled into the shadow jar
    annotationProcessor group: 'io.kestra', name: 'processor', version: kestraVersion
    compileOnly group: 'io.kestra', name: 'core', version: kestraVersion
    // Kestra 2.0 moved the queue factory out of core into its own module.
    compileOnly group: 'io.kestra', name: 'queue', version: kestraVersion
    // ExecutionStreamingService streams io.micronaut.http.sse.Event; core does not expose micronaut-http transitively.
    compileOnly 'io.micronaut:micronaut-http'

    // The embedded HTTP server. Bundled, since Kestra does not provide it.
    implementation "io.javalin:javalin:$javalinVersion"

    // SPIKE (spike/sdk-execution-awaiter): Kestra's own API client, the sanctioned way for a plugin to
    // reach anything database-backed in 2.0 — see kestra-io/kestra#17991. Bundled; Kestra does not
    // provide it to plugins. Note Central has no 2.0-aligned release, 1.3.2 is the newest.
    //
    // Jackson and Reactor are excluded deliberately: Kestra core puts both on the plugin classpath, and
    // shading a second copy into this jar invites exactly the version clash the Jetty note in the README
    // describes. That leaves the generated client plus httpclient5 to bundle.
    implementation("io.kestra:kestra-api-client:$kestraApiClientVersion") {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.datatype'
        exclude group: 'com.fasterxml.jackson.jaxrs'
        exclude group: 'io.projectreactor'
    }
}


/**********************************************************************************************************************\
 * Test
 **********************************************************************************************************************/
test {
    useJUnitPlatform()
}

testlogger {
    theme = 'mocha-parallel'
    showExceptions = true
    showFullStackTraces = true
    showStandardStreams = true
    showPassedStandardStreams = false
    showSkippedStandardStreams = true
}

dependencies {
    // Platform
    testAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    testAnnotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'

    // micronaut
    testAnnotationProcessor 'io.micronaut:micronaut-inject-java'
    testAnnotationProcessor 'io.micronaut.validation:micronaut-validation-processor'
    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation 'io.micronaut:micronaut-jackson-databind'

    // A minimal in-memory Kestra runtime, so tests can actually execute flows.
    testAnnotationProcessor group: 'io.kestra', name: 'processor', version: kestraVersion
    testImplementation group: 'io.kestra', name: 'core', version: kestraVersion
    testImplementation group: 'io.kestra', name: 'queue', version: kestraVersion
    testImplementation group: 'io.kestra', name: 'tests', version: kestraVersion
    testImplementation group: 'io.kestra', name: 'repository-memory', version: kestraVersion
    testImplementation group: 'io.kestra', name: 'runner-memory', version: kestraVersion
    testImplementation group: 'io.kestra', name: 'storage-local', version: kestraVersion

    // test
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest'
    testImplementation 'org.hamcrest:hamcrest-library'
    testImplementation 'org.awaitility:awaitility'
    // Already the logging backend at test runtime; declared so a test can capture what the trigger logs.
    testImplementation 'ch.qos.logback:logback-classic'
}

/**********************************************************************************************************************\
 * Allure Reports
 **********************************************************************************************************************/
dependencies {
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    // Kestra's platform BOM pinned allure-bom up to 1.3.x but dropped it in 2.0, so pin it here.
    testImplementation platform("io.qameta.allure:allure-bom:$allureVersion")
    testImplementation 'io.qameta.allure:allure-junit5'
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    agent 'org.aspectj:aspectjweaver:1.9.25.1'
}

test {
    jvmArgs = ["-javaagent:${configurations.agent.singleFile}"]
}

/**********************************************************************************************************************\
 * Jacoco
 **********************************************************************************************************************/
test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
    }
}

/**********************************************************************************************************************\
 * Publish
 **********************************************************************************************************************/
mavenPublishing {
    publishToMavenCentral(true)
    // Not signed: the gh-pages static repo needs no signatures, and Central (which would require them) is
    // blocked for the io.kestra.plugin namespace. Signing a release with no key fails the publish, so a
    // future Central move must re-add signAllPublications() together with a signing key.
    coordinates("${project.group}", "${project.name}", "${project.version}")
    pom {
        name = "${project.name}"
        description = "${project.description}"
        url = "https://github.com/ulise/kestra-rest-plugin"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'USchulzeEyssingBK'
                name = 'USchulzeEyssingBK'
                email = 'uli@ulise.de'
            }
        }
        scm {
            connection = 'scm:git:'
            url = "https://github.com/ulise/kestra-rest-plugin"
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Suppress this validation error as we want to enforce the Kestra platform.
    suppressedValidationErrors.add('enforced-platform')
}

// Publish the existing (shaded) `maven` publication into a static, file-based Maven repository that is
// served publicly from the `gh-pages` branch — no credentials needed to consume, unlike GitHub Packages.
// The publish workflow points `ghPagesRepoDir` at a checkout of gh-pages so maven-metadata.xml merges
// across releases; locally it defaults to a build directory.
publishing {
    repositories {
        maven {
            name = 'GhPages'
            url = file(providers.gradleProperty('ghPagesRepoDir')
                .getOrElse(layout.buildDirectory.dir('gh-pages-maven').get().asFile.absolutePath)).toURI()
        }
    }
}

jar {
    manifest {
        attributes(
            'X-Kestra-Name': project.name,
            'X-Kestra-Title': 'REST Server',
            'X-Kestra-Group': project.group + '.restserver',
            'X-Kestra-Description': project.description,
            'X-Kestra-Version': project.version
        )
    }
}

shadowJar {
    archiveClassifier.set(null)
    // Let mergeServiceFiles() see every duplicate service file (e.g. Jetty's provider
    // registrations) instead of dropping them under the default EXCLUDE strategy.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()

    // With INCLUDE, the per-dependency license/notice metadata would otherwise be copied
    // in verbatim many times over; none of it is needed at runtime.
    exclude 'META-INF/LICENSE', 'META-INF/LICENSE.*', 'META-INF/NOTICE', 'META-INF/NOTICE.*'
}

/**********************************************************************************************************************\
 * Version
 **********************************************************************************************************************/
release {
    // Each release commit is composed as "<preCommitText> <message> '<tagName>'." — the version always comes
    // last, in quotes, and preCommitText is shared by all three. So the freeform style of the 1.0.0-1.3.0 tags
    // ("Release 1.3.0", "Start 1.3.1-SNAPSHOT development") cannot be reproduced here; these produce:
    //   chore(release): release 'v1.4.1'.
    //   chore(release): tag 'v1.4.1'.
    //   chore(release): start development on 'v1.4.2-SNAPSHOT'.
    preCommitText = 'chore(release):'
    preTagCommitMessage = 'release'
    tagCommitMessage = 'tag'
    newVersionCommitMessage = 'start development on'
    tagTemplate = 'v${version}'
    buildTasks = ['classes']
    git {
        requireBranch.set('main')
    }
}

/**********************************************************************************************************************\
 * Dev
 **********************************************************************************************************************/
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
