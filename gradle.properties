# Managed by the net.researchgate.release plugin: `./gradlew release` drops the -SNAPSHOT,
# tags v<version>, then bumps to the next -SNAPSHOT. 1.0.0 is already released and tagged.
version=1.4.1-SNAPSHOT

# Must match the Kestra instance the plugin is deployed to.
kestraVersion=1.3.28

# Javalin 7 is built on Jetty 12, matching Kestra 1.3. Javalin 6 is built on Jetty 11 and
# cannot share a classpath with Kestra's Jetty 12 — see README, "Javalin and Jetty".
javalinVersion=7.2.2

# Normally the Jetty that javalinVersion is built against (see io.javalin:javalin-parent, property
# jetty.version). Kestra's BOM pins an older Jetty that Javalin 7 cannot run on.
# Deliberately one patch ahead of Javalin 7.2.2's 12.1.8: CVE-2026-10050 (jetty-security, Digest auth)
# is fixed in 12.1.10, and every downstream image scan reports it against this plugin's shadow jar.
# The plugin never touches Jetty's authentication, so this is hygiene, not a live fix. When Javalin
# publishes a release built on 12.1.10 or later, drop back to tracking javalin-parent. See #17.
jettyVersion=12.1.10

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
