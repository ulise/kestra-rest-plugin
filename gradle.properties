# Managed by the net.researchgate.release plugin: `./gradlew release` drops the -SNAPSHOT,
# tags v<version>, then bumps to the next -SNAPSHOT.
#
# The plugin's major mirrors Kestra's: 1.x targets Kestra 1.3.x, 2.x targets Kestra 2.0.x. So this
# branch jumps straight from 1.4.x to 2.0.0 rather than continuing 1.4.4 — it needs Java 25 and will
# not load on 1.3.x, which is not a patch. Keep the two lines' majors distinct: both publish to the
# same `io.kestra.plugin:plugin-rest-server` coordinate, so the major is the only thing telling a user
# which Kestra a given version is for. See "Versioning" in the README.
version=2.0.0-SNAPSHOT

# Must match the Kestra instance the plugin is deployed to.
# Kestra 2.0 migration: the 2.0.0-rcN tags are NOT published to Maven Central, only the daily
# 2.0.0-SNAPSHOT from `develop` on the Sonatype snapshot repo. Pin a release version here once
# 2.0.0 GA lands. See the "Kestra 2.0" section in README.
kestraVersion=2.0.0-SNAPSHOT

# Javalin 7 is built on Jetty 12, matching Kestra 1.3. Javalin 6 is built on Jetty 11 and
# cannot share a classpath with Kestra's Jetty 12 — see README, "Javalin and Jetty".
javalinVersion=7.2.2

# Normally the Jetty that javalinVersion is built against (see io.javalin:javalin-parent, property
# jetty.version). Kestra's BOM pins an older Jetty that Javalin 7 cannot run on.
# Deliberately one patch ahead of Javalin 7.2.2's 12.1.8: CVE-2026-10050 (jetty-security, Digest auth)
# is fixed in 12.1.10, and every downstream image scan reports it against this plugin's shadow jar.
# The plugin never touches Jetty's authentication, so this is hygiene, not a live fix. When Javalin
# publishes a release built on 12.1.10 or later, drop back to tracking javalin-parent. See #17.
jettyVersion=12.1.10

# Kestra's platform BOM pinned allure-bom through 1.3.x; the 2.0 BOM no longer does.
allureVersion=2.33.0

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
